<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bgGrad)" stroke="#6366f1" stroke-width="16" />

  <!-- Inner glowing border / ring -->
  <rect x="88" y="88" width="848" height="848" rx="200" fill="none" stroke="#4f46e5" stroke-width="4" opacity="0.4" />

  <!-- Central stylized API / Send / Lightning glyph -->
  <!-- Left node -->
  <circle cx="320" cy="512" r="56" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="320" cy="512" r="28" fill="#ffffff" />

  <!-- Right node -->
  <circle cx="704" cy="512" r="56" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="704" cy="512" r="28" fill="#ffffff" />

  <!-- Center dynamic connection / rocket bolt -->
  <path d="M 460 300 L 580 470 L 510 490 L 620 724 L 470 540 L 540 520 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- Modern OP monogram typography -->
  <text x="512" y="830" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8" opacity="0.95">OPENPOST</text>
</svg>
